name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-figma
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mini-figma/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Для project-pages (<user>.github.io/<repo>) site смонтирован в /<repo>/,
        # поэтому prod-base должен включать и репозиторий, и подпапку приложения.
        # В dev base остаётся '/mini-figma/' из vite.config.ts.
        run: npm run build -- --base=/habit-tracker/mini-figma/

      - name: Stage Pages artifact
        # Артефакт = корень сайта: лендинг в корне, собранное приложение в mini-figma/.
        run: |
          mkdir -p ../pages-artifact
          cp -r dist ../pages-artifact/mini-figma
          cp ../*.html ../pages-artifact/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
